[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "concomitant_sim"
version = "0.1.0"
description = "A Python package for simulating concomitant fields in MRI."
requires-python = ">=3.8"
authors = [
    { name = "Haotian Hong", email = "hhong6@mgh.harvard.edu" }]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
torch = ["torch"]
cupy = ["cupy-cuda12x"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]